name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Unit Tests
        run: uv run pytest tests/unit/ -v

      - name: Verify Schema Export
        run: uv run python -m Kodiac_robotics.contracts.schema_export
